server:
  port: 8080
  servlet:
    context-path: /api

cxf:
  path: /services

spring:
  application:
    name: bdis-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:biomed_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:bdis}
    password: ${MYSQL_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bdis:
  security:
    jwt:
      secret: ${BDIS_JWT_SECRET:bdis-development-secret-change-me}
      access-token-ttl-minutes: ${BDIS_JWT_ACCESS_TOKEN_TTL_MINUTES:120}
      issuer: bdis-api
  bootstrap:
    token: ${BDIS_BOOTSTRAP_TOKEN:}
  file:
    storage-path: ${BDIS_FILE_STORAGE_PATH:./storage}
  trace:
    public-web-base-url: ${BDIS_PUBLIC_WEB_BASE_URL:http://localhost:3000}
  soap:
    mode: ${BDIS_SOAP_MODE:mock}
    campus-endpoint: ${BDIS_SOAP_CAMPUS_ENDPOINT:http://localhost:${server.port}/api/services/campus-growth}
    connect-timeout-ms: ${BDIS_SOAP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${BDIS_SOAP_READ_TIMEOUT_MS:5000}

file:
  atlas-import-path: ${FILE_ATLAS_IMPORT_PATH:import/herb_atlas}

herb:
  assistant:
    enabled: ${HERB_ASSISTANT_ENABLED:true}
    mock-enabled: ${HERB_ASSISTANT_MOCK_ENABLED:false}
    model: ${HERB_ASSISTANT_MODEL:}
    base-url: ${HERB_ASSISTANT_BASE_URL:}
    api-key: ${HERB_ASSISTANT_API_KEY:}
    timeout-seconds: ${HERB_ASSISTANT_TIMEOUT_SECONDS:60}
    rag:
      enabled: ${HERB_ASSISTANT_RAG_ENABLED:true}
      mock-embedding-enabled: ${HERB_ASSISTANT_RAG_MOCK_EMBEDDING_ENABLED:true}
      embedding-enabled: ${HERB_ASSISTANT_RAG_EMBEDDING_ENABLED:false}
      embedding-model: ${HERB_ASSISTANT_RAG_EMBEDDING_MODEL:}
      embedding-base-url: ${HERB_ASSISTANT_RAG_EMBEDDING_BASE_URL:${HERB_ASSISTANT_BASE_URL:}}
      embedding-api-key: ${HERB_ASSISTANT_RAG_EMBEDDING_API_KEY:${HERB_ASSISTANT_API_KEY:}}
      vector-store-path: ${HERB_ASSISTANT_RAG_VECTOR_STORE_PATH:data/vector-store/herb-knowledge.json}
      chunk-size: ${HERB_ASSISTANT_RAG_CHUNK_SIZE:800}
      chunk-overlap: ${HERB_ASSISTANT_RAG_CHUNK_OVERLAP:100}
      top-k: ${HERB_ASSISTANT_RAG_TOP_K:5}
      similarity-threshold: ${HERB_ASSISTANT_RAG_SIMILARITY_THRESHOLD:0.6}
  atlas:
    auto-import: ${HERB_ATLAS_AUTO_IMPORT:true}
  recognition:
    enabled: ${HERB_RECOGNITION_ENABLED:true}
    mock-enabled: ${HERB_RECOGNITION_MOCK_ENABLED:false}
    service-url: ${HERB_RECOGNITION_SERVICE_URL:http://localhost:8001/recognize}
    feature-service-url: ${HERB_FEATURE_SERVICE_URL:http://localhost:8002/feature}
    timeout-seconds: ${HERB_RECOGNITION_TIMEOUT_SECONDS:180}
  feature:
    enabled: ${HERB_FEATURE_ENABLED:true}
    service-url: ${HERB_FEATURE_EXTRACTION_SERVICE_URL:http://localhost:8002/extract-feature}
    timeout-seconds: ${HERB_FEATURE_TIMEOUT_SECONDS:30}
    mock-enabled: ${HERB_FEATURE_MOCK_ENABLED:false}
    model-name: ${HERB_FEATURE_MODEL_NAME:resnet50}
    model-version: ${HERB_FEATURE_MODEL_VERSION:resnet50-imagenet-v1}
    mock-dimension: ${HERB_FEATURE_MOCK_DIMENSION:512}
    recovery-enabled: ${HERB_FEATURE_RECOVERY_ENABLED:true}
    recovery-initial-delay-ms: ${HERB_FEATURE_RECOVERY_INITIAL_DELAY_MS:5000}
    recovery-interval-ms: ${HERB_FEATURE_RECOVERY_INTERVAL_MS:60000}
  identification:
    high-threshold: ${HERB_IDENTIFICATION_HIGH_THRESHOLD:0.85}
    middle-threshold: ${HERB_IDENTIFICATION_MIDDLE_THRESHOLD:0.60}
    top-k: ${HERB_IDENTIFICATION_TOP_K:5}
    enable-doubao-review: ${HERB_IDENTIFICATION_ENABLE_DOUBAO_REVIEW:true}
